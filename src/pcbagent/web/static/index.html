<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PCBAgent</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 26 26'%3E%3Crect x='1' y='1' width='24' height='24' rx='5' fill='%2314231A'/%3E%3Cpath d='M6 8h6l3 3h5M6 18h4l4-4h6' stroke='%23D4873A' stroke-width='2' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='20' cy='11' r='2' fill='%23E5BA5E'/%3E%3Ccircle cx='6' cy='18' r='2' fill='%23E5BA5E'/%3E%3C/svg%3E">
<script type="application/json" id="cfg">__PCBAGENT_CONFIG__</script>
<style>
/* Layout: designs list | chat with the agent | the board and its evidence. Everything is local; no web fonts or CDNs. */
:root {
  --bg: #EDF1EE; --surface: #FFFFFF; --surface-2: #E3E9E4; --surface-3: #D7DFD9;
  --ink: #142019; --muted: #56645B; --line: #CBD4CD;
  --accent: #A3561A; --accent-ink: #FFFFFF; --accent-soft: #F4E5D6;
  --ok: #1D7442; --ok-soft: #DAEEE0; --warn: #8A5D00; --warn-soft: #F5EACB; --bad: #B3261E; --bad-soft: #F7DEDB;
  --user: #22362B; --user-ink: #EEF3EF;
  --paper: #FFFFFF; --paper-line: #D9DED9;
  --cv-bg: #0A120E; --cv-sub: #14231A; --cv-edge: #D6C45C; --cu-f: #D4873A; --cu-b: #4B8DD3; --pad: #E5BA5E;
  --silk: #EEF1EC; --crt: #6F8378; --cv-ink: #D9E2DC; --cv-muted: #8FA197; --cv-line: #22342A;
  --display: "Bahnschrift", "DIN Alternate", "Avenir Next Condensed", "Roboto Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "Cascadia Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --r: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1411; --surface: #151D19; --surface-2: #1C2621; --surface-3: #25312B; --ink: #E2E9E4; --muted: #94A299;
    --line: #2A3630; --accent: #E39A57; --accent-ink: #1A0F06; --accent-soft: #3A2716;
    --ok: #5DC48A; --ok-soft: #163325; --warn: #E2B44A; --warn-soft: #382C11; --bad: #F08A80; --bad-soft: #3D1B18;
    --user: #2C4636; --user-ink: #EEF3EF; --paper: #E6EAE5; --paper-line: #C9CFC9; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--display); font-stretch: condensed; font-weight: 600; margin: 0; line-height: 1.15; letter-spacing: 0.01em; text-wrap: balance; }
p { margin: 0; }
code, .mono { font-family: var(--mono); font-size: 0.86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 0.85rem; }
.eyebrow { font: 600 0.7rem/1.2 var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

/* ---------- app frame ---------- */
.app { height: 100%; display: grid; grid-template-columns: 236px minmax(360px, 0.9fr) minmax(0, 1.25fr); grid-template-rows: minmax(0, 1fr); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
.side { background: var(--surface); border-right: 1px solid var(--line); display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; min-height: 0; padding-left: env(safe-area-inset-left, 0px); }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.brand svg { flex: none; }
.brand b { font: 700 1.35rem/1 var(--display); font-stretch: condensed; letter-spacing: 0.01em; }
.brand b span { color: var(--accent); }
.newbtn { margin: 0 12px 10px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; font-weight: 600; }
.newbtn:hover { border-color: var(--muted); }
.dlist { overflow-y: auto; padding: 4px 8px 12px; display: grid; align-content: start; gap: 2px; }
.dlist a { display: grid; gap: 1px; padding: 8px 10px; border-radius: 6px; color: inherit; text-decoration: none; min-width: 0; }
.dlist a:hover { background: var(--surface-2); }
.dlist a[aria-current="page"] { background: var(--surface-3); }
.dlist a b { font-weight: 600; font-size: 0.9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dlist a span { font-size: 0.76rem; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.run { background: var(--accent); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.35; } }
.sidefoot { border-top: 1px solid var(--line); padding: 10px 12px 12px; display: grid; gap: 6px; font-size: 0.8rem; }
.statusbtn { display: flex; align-items: center; gap: 8px; text-align: left; border: 0; background: none; padding: 4px; border-radius: 5px; color: var(--muted); }
.statusbtn:hover { background: var(--surface-2); color: var(--ink); }
.empty-list { padding: 10px; font-size: 0.85rem; color: var(--muted); }

/* ---------- chat ---------- */
.chat { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; border-right: 1px solid var(--line); background: var(--bg); }
.chathead { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line); min-height: 52px; }
.chathead h1 { font-size: 1.2rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.chathead .eyebrow { flex: none; }
.menu-btn { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 4px 8px; }
.thread { overflow-y: auto; overflow-x: hidden; padding: 18px 18px 8px; display: grid; grid-template-columns: minmax(0, 1fr); align-content: start; gap: 12px; scroll-behavior: smooth; }
.msg { max-width: 92%; overflow-wrap: anywhere; }
.msg.user { justify-self: end; background: var(--user); color: var(--user-ink); padding: 9px 13px; border-radius: 14px 14px 4px 14px; white-space: pre-wrap; }
.msg.agent { justify-self: start; display: grid; gap: 6px; }
.msg.agent p, .msg.agent ul { margin: 0; }
.msg.agent ul { padding-left: 1.2em; }
.msg.agent code { background: var(--surface-2); padding: 1px 4px; border-radius: 3px; }
.who { font: 600 0.72rem/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.step { justify-self: stretch; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.step.fail { border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
.step-top { display: flex; align-items: flex-start; gap: 10px; }
.step-ico { flex: none; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; margin-top: 1px; }
.step-ico.ok { background: var(--ok-soft); color: var(--ok); }
.step-ico.fail { background: var(--bad-soft); color: var(--bad); }
.step-ico.run { border: 2px solid var(--surface-3); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
.step-ico.stop { background: var(--surface-2); color: var(--muted); }
@keyframes spin { to { transform: rotate(360deg); } }
.step-title { font-weight: 600; }
.step-sub { font-size: 0.86rem; color: var(--muted); overflow-wrap: anywhere; }
.step ul { margin: 0; padding-left: 1.1em; font-size: 0.86rem; display: grid; gap: 2px; }
.step .fails li { color: var(--bad); }
.step .prog { font: 400 0.8rem/1.5 var(--mono); color: var(--muted); }
.step details summary { cursor: pointer; font-size: 0.8rem; color: var(--muted); width: max-content; }
.step pre { margin: 6px 0 0; padding: 8px 10px; background: var(--surface-2); border-radius: 6px; font: 400 0.76rem/1.45 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 260px; overflow: auto; }
.step .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.linkbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font-size: 0.82rem; font-weight: 600; }
.linkbtn:hover { border-color: var(--muted); }
.note { justify-self: center; font-size: 0.8rem; color: var(--muted); text-align: center; max-width: 90%; }
.note.end .linkbtn { margin-left: 4px; }
.note.end { display: flex; align-items: center; gap: 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }
.err { justify-self: stretch; background: var(--bad-soft); color: var(--ink); border-radius: var(--r); padding: 10px 12px; font-size: 0.9rem; overflow-wrap: anywhere; }
.err b { color: var(--bad); }
.thinking { justify-self: start; display: flex; align-items: center; gap: 10px; font-size: 0.86rem; color: var(--muted); }
.dots { display: inline-flex; gap: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite ease-in-out; }
.dots i:nth-child(2) { animation-delay: 0.15s; } .dots i:nth-child(3) { animation-delay: 0.3s; }
@keyframes blink { 0%, 80%, 100% { opacity: 0.25; } 40% { opacity: 1; } }

/* welcome */
.welcome { display: grid; gap: 16px; padding: 8px 2px 4px; }
.welcome h2 { font-size: clamp(1.6rem, 3vw, 2.1rem); }
.welcome p { color: var(--muted); max-width: 52ch; }
.examples { display: grid; gap: 8px; }
.example { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 9px 12px; font-size: 0.9rem; }
.example:hover { border-color: var(--accent); }
.setup { background: var(--warn-soft); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 8px; font-size: 0.88rem; }
.setup ul { margin: 0; padding-left: 1.1em; display: grid; gap: 4px; }
.setup code { background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; user-select: all; }

/* composer */
.composer { border-top: 1px solid var(--line); padding: 10px 14px 12px; display: grid; gap: 6px; background: var(--bg); }
.composer-box { display: flex; align-items: flex-end; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.composer-box:focus-within { border-color: var(--accent); }
.composer textarea { flex: 1; border: 0; background: transparent; resize: none; padding: 6px 0; max-height: 180px; min-height: 24px; line-height: 1.45; outline: none; }
.sendbtn, .stopbtn { flex: none; height: 34px; min-width: 34px; border-radius: 8px; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 12px; font-weight: 600; }
.sendbtn { background: var(--accent); color: var(--accent-ink); }
.sendbtn:disabled { opacity: 0.4; cursor: not-allowed; }
.stopbtn { background: var(--surface-2); border: 1px solid var(--line); }
.composer-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.78rem; color: var(--muted); }
.composer-meta select { border: 1px solid var(--line); background: var(--surface); border-radius: 5px; padding: 1px 4px; font-size: 0.78rem; }
.composer-err { font-size: 0.84rem; color: var(--bad); }

/* ---------- results ---------- */
.results { min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; grid-template-columns: minmax(0, 1fr); padding: 0 20px 28px; padding-right: max(20px, env(safe-area-inset-right, 0px)); display: grid; align-content: start; gap: 16px; }
.reshead { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: 12px 0 0; display: grid; gap: 10px; border-bottom: 1px solid var(--line); }
.phases { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 0.8rem; }
.phase { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--muted); }
.phase.done { color: var(--ink); } .phase.done .dot { background: var(--ok); }
.phase.now { color: var(--ink); border-color: var(--accent); } .phase.now .dot { background: var(--accent); }
.phase.bad .dot { background: var(--bad); }
.tabs { display: flex; gap: 2px; overflow-x: auto; }
.tab { border: 0; background: none; padding: 8px 12px 9px; font-weight: 600; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.tab:focus-visible { outline-offset: -3px; }
#board.hide-crt .fp:focus-visible .crt { display: inline; }
.tab small { font-weight: 400; color: var(--muted); margin-left: 4px; }
.pane { display: grid; gap: 16px; min-width: 0; }
.placeholder { border: 1px dashed var(--line); border-radius: var(--r); padding: 28px 20px; text-align: center; color: var(--muted); display: grid; gap: 6px; justify-items: center; }
.placeholder b { color: var(--ink); font-weight: 600; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 7px; border-radius: 999px; padding: 3px 11px 3px 9px; font-size: 0.82rem; background: var(--surface); border: 1px solid var(--line); }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.chip.warn i { background: var(--warn); } .chip.bad i { background: var(--bad); }

/* board */
.boardcard { border-radius: var(--r); overflow: hidden; background: var(--cv-bg); color: var(--cv-ink); }
.toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 9px 10px; border-bottom: 1px solid var(--cv-line); }
.layers { display: flex; flex-wrap: wrap; gap: 5px; }
.lt { position: relative; }
.lt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.lt label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; padding: 3px 8px; border-radius: 4px; border: 1px solid #2C3D33; cursor: pointer; color: var(--cv-muted); user-select: none; }
.lt label i { width: 10px; height: 10px; border-radius: 2px; background: var(--sw); opacity: 0.3; }
.lt input:checked + label { color: var(--cv-ink); border-color: #48604F; }
.lt input:checked + label i { opacity: 1; }
.lt input:focus-visible + label { outline: 2px solid var(--cu-f); outline-offset: 1px; }
.tools { display: flex; gap: 5px; margin-left: auto; flex-wrap: wrap; }
.tbtn { border: 1px solid #2C3D33; background: transparent; color: var(--cv-ink); border-radius: 4px; height: 30px; min-width: 30px; padding: 0 9px; font-size: 0.82rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.tbtn:hover { border-color: #5A7563; }
.tbtn.primary { background: var(--cu-f); border-color: var(--cu-f); color: #1B0E03; font-weight: 600; }
.stage { position: relative; }
#board { display: block; width: 100%; height: auto; max-height: 62vh; cursor: grab; touch-action: pan-y; background: var(--cv-bg); }
#board.dragging { cursor: grabbing; }
.caption { position: absolute; left: 10px; top: 8px; font: 500 0.76rem/1.3 var(--mono); color: var(--cv-ink); background: rgba(10,18,14,0.8); padding: 4px 8px; border-radius: 4px; pointer-events: none; }
.scalebar { position: absolute; right: 10px; bottom: 8px; font: 400 0.7rem/1 var(--mono); color: var(--cv-muted); display: grid; justify-items: end; gap: 4px; pointer-events: none; }
.scalebar span { display: block; height: 4px; border: 1px solid var(--cv-muted); border-top: 0; }
.readout { font: 400 0.78rem/1.45 var(--mono); color: var(--cv-muted); padding: 8px 10px 9px; border-top: 1px solid var(--cv-line); height: calc(3 * 1.45em + 17px); overflow-y: auto; overflow-wrap: anywhere; }
.readout b { color: var(--cv-ink); font-weight: 500; }
#board .sub { fill: var(--cv-sub); stroke: var(--cv-edge); }
#board .bg { fill: var(--cv-bg); }
#board .zf { fill: var(--cu-f); fill-opacity: 0.2; }
#board .zb { fill: var(--cu-b); fill-opacity: 0.2; }
#board .tf { stroke: var(--cu-f); fill: none; stroke-linecap: round; }
#board .tb { stroke: var(--cu-b); fill: none; stroke-linecap: round; }
#board .via, #board .pad { fill: var(--pad); }
#board .hole { fill: var(--cv-bg); }
#board .crt { fill: transparent; stroke: var(--crt); stroke-dasharray: 0.25 0.2; }
#board .ref { fill: var(--silk); font-family: var(--mono); font-weight: 600; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
#board .fp { cursor: pointer; }
#board .fp:hover .crt, #board .fp.sel .crt { stroke: var(--silk); stroke-dasharray: none; fill: rgba(238,241,236,0.05); }
#board .fp:focus { outline: none; }
#board .fp:focus-visible .crt { stroke: var(--cu-f); stroke-dasharray: none; }
#board.netfocus [data-net]:not(.on) { opacity: 0.18; }
#board.netfocus .ref { opacity: 0.5; }
#board .route-hidden { opacity: 0; }
.hide-zf .zf, .hide-zb .zb, .hide-tf .tf, .hide-tb .tb, .hide-silk .ref, .hide-crt .crt { display: none; }

.two { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; align-content: start; }
.card > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card h3 { font-size: 1.1rem; }
.partlist { display: grid; gap: 1px; margin: 0; padding: 0; list-style: none; }
.partlist button { width: 100%; display: grid; grid-template-columns: 3em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; text-align: left; background: transparent; border: 0; border-radius: 5px; padding: 5px 7px; }
.partlist button:hover, .partlist button.hl { background: var(--surface-2); }
.partlist .r { font: 600 0.84rem var(--mono); color: var(--accent); }
.partlist .v { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.partlist .l { font: 400 0.74rem var(--mono); color: var(--muted); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; font-size: 0.88rem; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; overflow-wrap: anywhere; }
.pins { display: flex; flex-wrap: wrap; gap: 6px; }
.pin { font: 400 0.76rem var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 2px 7px; background: var(--surface-2); }
.pin b { color: var(--accent); font-weight: 500; }
.rating { display: grid; gap: 4px; font-size: 0.85rem; }
.meter { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.meter.warn span { background: var(--warn); } .meter.bad span { background: var(--bad); }
.clist { display: grid; margin: 0; padding: 0; list-style: none; }
.clist li { display: grid; grid-template-columns: 4.6em minmax(0, 1fr) auto; gap: 10px; align-items: baseline; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 0.88rem; }
.clist li:last-child { border-bottom: 0; }
.ctype { font: 500 0.7rem var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.clist p span { display: block; color: var(--muted); font-size: 0.8rem; }
.pill { display: inline-block; font: 600 0.7rem/1 var(--body); letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 7px; border-radius: 4px; background: var(--ok-soft); color: var(--ok); white-space: nowrap; }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); } .pill.plain { background: var(--surface-2); color: var(--muted); }

/* tables */
.tablebox { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
th { text-align: left; font: 600 0.68rem/1.2 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 11px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
.vtable { min-width: 560px; } .btable { min-width: 0; }
.btable th { white-space: normal; }
.btable td:nth-child(3) { min-width: 9em; }
.req .pill { margin-right: 4px; vertical-align: 1px; }
.req b { display: block; font: 500 0.84rem var(--mono); }
.req span { color: var(--muted); font-size: 0.8rem; }
tr.failrow td { background: color-mix(in srgb, var(--bad-soft) 55%, transparent); }
.band { position: relative; height: 22px; min-width: 110px; }
.band .axis { position: absolute; left: 0; right: 0; top: 10px; height: 2px; background: var(--surface-2); }
.band .win { position: absolute; top: 4px; height: 14px; background: var(--ok-soft); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.band .win.openl { border-left: 0; } .band .win.openr { border-right: 0; }
.band .rng { position: absolute; top: 8px; height: 6px; background: var(--ink); border-radius: 3px; min-width: 3px; }
.band .rng.bad { background: var(--bad); }
.band .nom { position: absolute; top: 3px; width: 2px; height: 16px; background: var(--accent); }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.78rem; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.lg-win { width: 18px; height: 10px; background: var(--ok-soft); border-left: 2px solid var(--ok); border-right: 2px solid var(--ok); }
.lg-rng { width: 18px; height: 6px; background: var(--ink); border-radius: 3px; }
.lg-nom { width: 2px; height: 12px; background: var(--accent); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.paper { background: var(--paper); border: 1px solid var(--paper-line); border-radius: var(--r); padding: 10px; overflow: auto; }
.paper img { display: block; width: 100%; height: auto; min-width: 480px; max-width: none; }
.filelist { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }
.filelist li { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; padding: 8px 0; border-bottom: 1px solid var(--line); }
.filelist li:last-child { border-bottom: 0; }
.filelist a { color: var(--accent); font-family: var(--mono); font-size: 0.86rem; overflow-wrap: anywhere; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 0.86rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.costline { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 0.86rem; color: var(--muted); }
.costline b { color: var(--ink); }
.request-q { font-size: 1.05rem; max-width: 70ch; }

/* modal */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink); padding: 0; width: min(560px, calc(100vw - 32px)); }
dialog::backdrop { background: rgba(10, 18, 14, 0.45); }
.dlg { padding: 18px 20px 20px; display: grid; gap: 12px; }
.dlg header { display: flex; justify-content: space-between; align-items: center; }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; font-size: 0.88rem; }
.checks li { display: grid; grid-template-columns: 18px 9.5em minmax(0, 1fr); gap: 8px; align-items: baseline; }
.checks .d { color: var(--muted); font-size: 0.8rem; overflow-wrap: anywhere; }

/* ---------- narrow screens ---------- */
.mobile-switch { display: none; }
.backdrop { display: none; }
.side-close { display: none; }
@media (max-width: 1180px) {
  .app { grid-template-columns: minmax(340px, 0.95fr) minmax(0, 1.2fr); }
  .side { position: fixed; z-index: 20; inset: 0 auto 0 0; width: 270px; transform: translateX(-100%); visibility: hidden; transition: transform 0.2s, visibility 0s 0.2s; box-shadow: 0 0 40px rgba(0,0,0,0.25); }
  .side.open { transform: none; visibility: visible; transition: transform 0.2s; }
  .side.open ~ .backdrop { display: block; position: fixed; inset: 0; z-index: 19; background: rgba(10, 18, 14, 0.35); }
  .side-close { display: inline-flex; margin-left: auto; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 2px 8px; }
  .menu-btn { display: inline-flex; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .mobile-switch { display: flex; gap: 4px; padding: 8px max(12px, env(safe-area-inset-left, 0px)); border-bottom: 1px solid var(--line); background: var(--surface); }
  .mobile-switch button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px; font-weight: 600; }
  .mobile-switch button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .chat, .results { grid-row: 2; grid-column: 1; }
  .app[data-view="chat"] .results, .app[data-view="results"] .chat { display: none; }
  .chat { border-right: 0; }
  .menu-btn { display: none; }
  .tabs { flex-wrap: wrap; }
  .thread { padding: 14px 14px 8px; }
  .results { padding: 0 max(14px, env(safe-area-inset-left, 0px)) 24px; }
  .chathead { padding: 10px 14px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
</style>
</head>
<body>
<div class="app" id="app" data-view="chat">
  <div class="mobile-switch" role="group" aria-label="View">
    <button type="button" id="ms-menu" aria-label="Designs">☰</button>
    <button type="button" id="ms-chat" aria-pressed="true">Chat</button>
    <button type="button" id="ms-results" aria-pressed="false">Board</button>
  </div>

  <aside class="side" id="side" aria-label="Designs">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true"><rect x="1" y="1" width="24" height="24" rx="5" fill="var(--cv-sub)"/><path d="M6 8h6l3 3h5M6 18h4l4-4h6" stroke="var(--cu-f)" stroke-width="2" fill="none" stroke-linecap="round"/><circle cx="20" cy="11" r="2" fill="var(--pad)"/><circle cx="20" cy="14" r="2" fill="var(--pad)"/><circle cx="6" cy="8" r="2" fill="var(--pad)"/><circle cx="6" cy="18" r="2" fill="var(--pad)"/></svg>
      <b>PCB<span>Agent</span></b>
      <button class="side-close" type="button" id="side-close" aria-label="Close the designs list">✕</button>
    </div>
    <button class="newbtn" type="button" id="new-design">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>New design
    </button>
    <nav class="dlist" id="dlist" aria-label="Your designs"></nav>
    <div class="sidefoot">
      <button class="statusbtn" type="button" id="status-btn"><span class="dot" id="status-dot"></span><span id="status-text">Checking setup…</span></button>
      <span class="muted">Runs on this computer only.</span>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <section class="chat" aria-label="Conversation">
    <div class="chathead">
      <button class="menu-btn" type="button" id="menu-btn" aria-label="Show designs">☰</button>
      <h1 id="chat-title">New design</h1>
      <span class="eyebrow" id="chat-phase"></span>
    </div>
    <div class="thread" id="thread" aria-live="polite"></div>
    <form class="composer" id="composer">
      <div class="composer-err" id="composer-err" hidden></div>
      <div class="composer-box">
        <textarea id="prompt" rows="1" placeholder="Describe the board you want" aria-label="Message to PCBAgent"></textarea>
        <button class="stopbtn" type="button" id="stop" hidden>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="1" y="1" width="10" height="10" rx="2" fill="currentColor"/></svg>Stop
        </button>
        <button class="sendbtn" type="submit" id="send" aria-label="Send">
          <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 8h11M9 3.5 13.5 8 9 12.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="composer-meta">
        <label>Model <select id="model"></select></label>
        <span id="composer-hint">Enter to send · Shift+Enter for a new line</span>
      </div>
    </form>
  </section>

  <main class="results" id="results" aria-label="Results">
    <div class="reshead">
      <div class="phases" id="phases"></div>
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab" role="tab" type="button" data-tab="board" aria-selected="true">Board</button>
        <button class="tab" role="tab" type="button" data-tab="sim" aria-selected="false">Simulation</button>
        <button class="tab" role="tab" type="button" data-tab="sch" aria-selected="false">Schematic</button>
        <button class="tab" role="tab" type="button" data-tab="parts" aria-selected="false">Parts</button>
        <button class="tab" role="tab" type="button" data-tab="files" aria-selected="false">Files</button>
      </div>
    </div>
    <div class="pane" id="pane-board" role="tabpanel"></div>
    <div class="pane" id="pane-sim" role="tabpanel" hidden></div>
    <div class="pane" id="pane-sch" role="tabpanel" hidden></div>
    <div class="pane" id="pane-parts" role="tabpanel" hidden></div>
    <div class="pane" id="pane-files" role="tabpanel" hidden></div>
  </main>
</div>

<dialog id="setup-dlg" aria-labelledby="setup-h">
  <div class="dlg">
    <header><h2 id="setup-h">Setup</h2><button class="btn" type="button" id="setup-close">Close</button></header>
    <div id="setup-body"></div>
    <div class="btnrow"><button class="btn" type="button" id="setup-refresh">Check again</button></div>
  </div>
</dialog>

<script nonce="__PCBAGENT_NONCE__">
(function () {
  "use strict";
  const CFG = JSON.parse(document.getElementById("cfg").textContent);
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const NS = "http://www.w3.org/2000/svg";
  const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const coarse = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
  const EXAMPLES = [
    "Convert a 5 V USB supply to 3.3 V for up to 500 mA, with a power-on LED.",
    "3.3 V supply from a single LiPo cell (3.7 to 4.2 V) for a 100 mA sensor node; sleep current under 10 uA.",
    "Scale a 0-5 V signal to 0-3.3 V for a 3.3 V microcontroller ADC input (1 MOhm).",
    "Anti-aliasing RC low-pass filter for an ADC: 1 kHz corner (within 15 %), at least 15 dB down at 10 kHz.",
    "Power indicator LED for a 3.3 V rail, 2 to 4 mA, from a 2-pin header.",
  ];

  // ---------- api ----------
  async function handle(r) {
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const e = new Error(data.error || r.statusText); e.status = r.status; throw e; }
    return data;
  }
  const api = {
    get: (p) => fetch(p, { headers: { Accept: "application/json" } }).then(handle),
    post: (p, body) => fetch(p, { method: "POST", headers: { "Content-Type": "application/json", "X-PCBAgent-Token": CFG.token }, body: JSON.stringify(body || {}) }).then(handle),
  };

  // ---------- formatting ----------
  const PFX = [[1e9, "G"], [1e6, "M"], [1e3, "k"], [1, ""], [1e-3, "m"], [1e-6, "µ"], [1e-9, "n"], [1e-12, "p"]];
  const trim = (x, d) => String(+x.toPrecision(d));
  // Everything put into HTML goes through esc() or num(): design folders are files, and files can be edited.
  const num = (v) => { const n = Number(v); return Number.isFinite(n) ? String(n) : "—"; };
  function eng(v, unit, digits) {
    digits = digits || 3;
    v = Number(v); unit = esc(unit || "");
    if (v == null || !Number.isFinite(v)) return "—";
    if (unit === "C") return trim(v, digits) + " °C";
    if (unit === "dB") return trim(v, digits) + " dB";
    const a = Math.abs(v);
    if (a === 0) return "0 " + unit;
    for (const [f, p] of PFX) if (a >= f * 0.9995) return trim(v / f, digits) + " " + p + unit;
    return v.toExponential(2) + " " + unit;
  }
  const money = (v) => { const n = Number(v); return v == null || !Number.isFinite(n) ? "—" : "$" + (n < 0.1 ? n.toFixed(3) : n.toFixed(2)); };
  function ago(ts) {
    if (!ts) return "";
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " min ago";
    if (s < 86400) return Math.floor(s / 3600) + " h ago";
    return new Date(ts * 1000).toLocaleDateString();
  }
  function md(text) {
    // A small, safe subset of Markdown: paragraphs, "- " lists, `code`, **bold**.
    const inline = (s) => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    const out = []; let list = null;
    for (const raw of String(text).split("\n")) {
      const line = raw.trimEnd();
      const m = line.match(/^\s*(?:[-*]|\d+\.)\s+(.*)$/);
      if (m) { if (!list) { list = []; } list.push("<li>" + inline(m[1]) + "</li>"); continue; }
      if (list) { out.push("<ul>" + list.join("") + "</ul>"); list = null; }
      if (line.trim()) out.push("<p>" + inline(line) + "</p>");
    }
    if (list) out.push("<ul>" + list.join("") + "</ul>");
    return out.join("");
  }

  // ---------- state ----------
  const S = { filesMsg: null, health: null, designs: [], running: null, current: null, bundle: null, es: null, lastSeq: 0, histCount: 0, runModel: "", tab: "board", cards: {}, activeCard: null, thinkingEl: null, thinkingSince: 0, refreshTimer: null, autoReplay: false, boardSig: "" };

  // ---------- setup / health ----------
  async function loadHealth(refresh) {
    try { S.health = await api.get("/api/health" + (refresh ? "?refresh=1" : "")); } catch (e) { S.health = null; }
    renderHealth();
  }
  function setupProblems() {
    const h = S.health; if (!h) return ["The server did not answer the setup check."];
    const p = [];
    if (h.missing_tools.length) p.push(`Missing tools: ${esc(h.missing_tools.join(", "))}. Run <code>pcbagent doctor</code> for details.`);
    if (!h.catalog.present) p.push(`No parts catalog. Run <code>pcbagent catalog update</code>, or <code>pcbagent catalog sample</code> for a demo with fake parts.`);
    if (!h.ollama.reachable) p.push(`Ollama is not reachable at ${esc(h.ollama.host)}. Start it with <code>ollama serve</code>.`);
    else if (!h.ollama.models.length) p.push(`Ollama has no models. Run <code>ollama pull ${esc(h.model)}</code>.`);
    else if (!modelAvailable(selectedModel())) p.push(`The model ${esc(selectedModel())} is not pulled. Run <code>ollama pull ${esc(selectedModel())}</code> or pick another model below.`);
    return p;
  }
  function modelAvailable(m) { const ms = (S.health && S.health.ollama.models) || []; return ms.includes(m) || ms.includes(m + ":latest"); }
  function selectedModel() { return $("model").value || CFG.model; }
  function renderHealth() {
    const h = S.health, probs = setupProblems();
    $("status-dot").className = "dot " + (probs.length ? "warn" : "ok");
    $("status-text").textContent = probs.length ? `${probs.length} setup item${probs.length > 1 ? "s" : ""} to fix` : (h.catalog.sample ? "Ready · sample catalog" : "Ready");
    const sel = $("model"), cur = sel.value || CFG.model;
    const models = (h && h.ollama.models.length) ? h.ollama.models.slice() : [];
    if (!models.includes(cur) && !models.includes(cur + ":latest")) models.unshift(cur);
    sel.innerHTML = models.map((m) => `<option ${m === cur || m === cur + ":latest" ? "selected" : ""}>${esc(m)}</option>`).join("");
    const body = [];
    if (h) {
      body.push(`<ul class="checks">`);
      for (const t of h.tools) body.push(`<li><span>${t.ok ? "✓" : "✗"}</span><span>${esc(t.name)}</span><span class="d">${esc(t.detail)}</span></li>`);
      body.push(`<li><span>${h.catalog.present ? (h.catalog.sample ? "!" : "✓") : "✗"}</span><span>parts catalog</span><span class="d">${h.catalog.present ? `${num(h.catalog.parts)} parts${h.catalog.sample ? " (sample catalog with fake part numbers)" : ""}` : "not installed"}</span></li>`);
      body.push(`<li><span>${h.ollama.reachable ? "✓" : "✗"}</span><span>Ollama</span><span class="d">${h.ollama.reachable ? `${esc(h.ollama.host)} · ${h.ollama.models.length} model(s)` : esc(h.ollama.error || "not reachable")}</span></li>`);
      body.push(`</ul><p class="small muted">Designs are saved in <code>${esc(h.designs_dir)}</code>. PCBAgent ${esc(h.version)}.</p>`);
    }
    if (probs.length) body.unshift(`<div class="setup"><b>To start a design</b><ul>${probs.map((p) => `<li>${p}</li>`).join("")}</ul></div>`);
    $("setup-body").innerHTML = body.join("");
    if (!S.current) renderWelcome();
  }

  // ---------- designs list ----------
  async function loadDesigns() {
    const before = S.running;
    try { const d = await api.get("/api/designs"); S.designs = d.designs; S.running = d.running; } catch (e) { /* keep last list */ }
    // The open design's run ended without this page hearing it (e.g. the server restarted): resync.
    if (S.current && before === S.current && S.running !== S.current) scheduleRefresh(50);
    if (before !== S.running && typeof schedulePoll === "function") schedulePoll();
    renderDesigns(); updateComposer(); syncContinue();
  }
  function phaseDot(d) {
    if (S.running === d.id) return "run";
    if (d.passed || d.phase === "done") return "ok";
    return "warn";
  }
  const PHASE_TEXT = { spec: "no spec yet", circuit: "circuit not verified yet", layout: "circuit verified", done: "board routed" };
  function renderDesigns() {
    const nav = $("dlist");
    if (!S.designs.length) { nav.innerHTML = `<p class="empty-list">No designs yet. Describe a board to start one.</p>`; return; }
    nav.innerHTML = S.designs.map((d) => `<a href="#/d/${encodeURIComponent(d.id)}" ${d.id === S.current ? 'aria-current="page"' : ""}><b>${esc(d.title)}</b><span><i class="dot ${phaseDot(d)}"></i>${S.running === d.id ? "working…" : esc(PHASE_TEXT[d.phase] || d.phase || "")}${d.board_mm ? ` · ${num(d.board_mm[0])}×${num(d.board_mm[1])} mm` : ""} · ${esc(ago(d.updated))}</span></a>`).join("");
  }

  // ---------- routing ----------
  function route() {
    const m = location.hash.match(/^#\/d\/(.+)$/);
    const id = m ? decodeURIComponent(m[1]) : null;
    $("side").classList.remove("open");
    if (id !== S.current || !id) openDesign(id);
  }

  async function openDesign(id) {
    if (S.es) { S.es.close(); S.es = null; }
    stopReplay();
    S.current = id; S.bundle = null; S.cards = {}; S.activeCard = null; S.lastSeq = 0; S.histCount = 0; S.boardSig = ""; S.autoReplay = false; S.runModel = CFG.model; hideThinking();
    $("thread").innerHTML = "";
    renderDesigns();
    if (!id) {
      $("chat-title").textContent = "New design"; $("chat-phase").textContent = "";
      renderWelcome(); renderResults(); updateComposer(); setView("chat");
      return;
    }
    await refreshBundle();
    if (S.current !== id) return;
    S.histCount = S.bundle ? S.bundle.event_count || 0 : 0;
    connectEvents(id);
  }

  function connectEvents(id) {
    const es = new EventSource(`/api/designs/${encodeURIComponent(id)}/events?after=${S.lastSeq}`);
    S.es = es;
    es.onmessage = (m) => {
      if (S.current !== id) return;
      let ev; try { ev = JSON.parse(m.data); } catch (_) { return; }
      if (ev.type === "resync") { openDesign(id); return; }
      if (ev.seq <= S.lastSeq) return;
      S.lastSeq = ev.seq;
      renderEvent(ev, ev.seq > S.histCount);
      if (ev.seq === S.histCount) historyLoaded();
    };
  }

  async function refreshBundle() {
    const id = S.current; if (!id) return;
    try {
      const b = await api.get(`/api/designs/${encodeURIComponent(id)}`);
      if (S.current !== id) return;
      S.bundle = b;
      $("chat-title").textContent = b.title || "Design";
      $("chat-phase").textContent = b.running ? "working" : (PHASE_TEXT[b.phase] || "");
      if (b.running) S.running = id; else if (S.running === id) S.running = null;
      const changed = renderResults();
      if (changed && b.board && S.autoReplay) { S.autoReplay = false; selectTab("board"); setTimeout(replay, 300); }
      if (!b.running) hideThinking();
      syncContinue();
      updateComposer();
    } catch (e) {
      if (e.status === 404) { location.hash = ""; }
    }
  }
  function scheduleRefresh(ms) {
    clearTimeout(S.refreshTimer);
    S.refreshTimer = setTimeout(refreshBundle, ms || 150);
  }

  // ---------- chat rendering ----------
  function nearBottom() { const t = $("thread"); return t.scrollHeight - t.scrollTop - t.clientHeight < 120; }
  function scrollThread(force) { const t = $("thread"); if (force || nearBottom()) t.scrollTop = t.scrollHeight; }
  function add(html, cls) {
    const el = document.createElement("div");
    el.className = cls; el.innerHTML = html;
    const t = $("thread");
    if (S.thinkingEl && S.thinkingEl.parentNode === t) t.insertBefore(el, S.thinkingEl); else t.appendChild(el);
    return el;
  }
  function showThinking(model, since) {
    hideThinking();
    const el = document.createElement("div");
    el.className = "thinking";
    el.innerHTML = `<span class="dots"><i></i><i></i><i></i></span><span><b>${esc(model)}</b> is thinking <span class="num" data-secs></span></span>`;
    $("thread").appendChild(el);
    S.thinkingEl = el; S.thinkingSince = since || Date.now();
    tickThinking();
  }
  function hideThinking() { if (S.thinkingEl) S.thinkingEl.remove(); S.thinkingEl = null; }
  function tickThinking() {
    if (!S.thinkingEl) return;
    const s = Math.max(0, Math.round((Date.now() - S.thinkingSince) / 1000));
    const el = S.thinkingEl.querySelector("[data-secs]"); if (el) el.textContent = s >= 2 ? `· ${s} s` : "";
  }
  setInterval(tickThinking, 1000);

  const TOOL_LABEL = {
    pcb_models: ["Looking up part models", "Looked up part models"],
    pcb_parts_search: ["Searching the parts catalog", "Searched the parts catalog"],
    pcb_spec: ["Writing the spec", "Locked the spec"],
    pcb_circuit: ["Simulating the circuit", "Circuit passed"],
    pcb_layout: ["Laying out the board", "Board routed"],
    pcb_status: ["Checking the design state", "Checked the design state"],
  };
  const ICON_OK = `<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6.2 5 8.5l4.5-5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  function renderSchPane() {
    const D = S.bundle, pane = $("pane-sch");
    if (!D || !D.schematic) { pane.innerHTML = placeholder("No schematic yet", D && D.verification && !D.verification.passed ? "The schematic is drawn once a circuit passes simulation." : "The schematic is drawn once a circuit passes simulation and its parts are chosen."); return; }
    pane.innerHTML = `<p class="muted small">Generated by PCBAgent from the current circuit; every footprint on the board links back to its symbol.</p><div class="paper"><img id="sch-img" alt="Schematic of ${esc(D.title)}"></div>`;
    $("sch-img").src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(D.schematic);
  }

  // ---------- parts pane ----------
  function renderPartsPane() {
    const D = S.bundle, pane = $("pane-parts");
    if (!D || !D.parts) { pane.innerHTML = placeholder("No parts chosen yet", "Parts are picked from your local catalog after the circuit passes simulation."); return; }
    const P = D.parts, c = P.cost || {};
    let rows = `<thead><tr><th>Refs</th><th>Value</th><th>Part</th><th>LCSC</th><th class="n">Stock</th><th class="n">Each</th><th class="n">Qty</th></tr></thead><tbody>`;
    for (const l of P.bom) rows += `<tr><td class="mono" style="color:var(--accent)">${esc(l.refs.join(", "))}</td><td>${esc(l.value)}</td><td>${esc(l.mpn)}<br><span class="muted small">${esc(l.manufacturer)}</span><br><span class="muted small mono" style="overflow-wrap:anywhere">${esc(l.footprint)}</span></td><td class="mono small">${esc(l.lcsc)}<br>${l.library_type === "basic" ? '<span class="pill">basic</span>' : `<span class="pill warn">${esc(l.library_type || "")}</span>`}</td><td class="n">${Number(l.stock).toLocaleString("en-US")}</td><td class="n">${money(l.price)}</td><td class="n">${num(l.qty)}</td></tr>`;
    pane.innerHTML = `${P.sample ? `<div class="setup"><p>These part numbers come from the <b>sample catalog</b> and are not real. Run <code>pcbagent catalog update</code> for the real JLCPCB list.</p></div>` : ""}
      <div class="tablebox"><table class="btable">${rows}</tbody></table></div>
      <div class="costline"><span>Parts for ${num(P.boards)} boards <b>${money(c.parts_usd)}</b></span>${c.extended_parts ? `<span>Extended-part setup fees about <b>${money(c.extended_fees_usd_estimate)}</b></span>` : ""}<span>${esc(c.note || "")}</span></div>
      ${P.failures.length ? `<div class="err"><b>Not orderable:</b> ${esc(P.failures.join("; "))}</div>` : ""}`;
  }

  // ---------- files pane ----------
  function renderFilesPane() {
    const D = S.bundle, pane = $("pane-files");
    if (!D) { pane.innerHTML = placeholder("No design open", "KiCad files and fabrication outputs appear here."); return; }
    const done = D.layout && D.layout.passed;
    const fmt = (n) => n > 1e6 ? (n / 1e6).toFixed(1) + " MB" : n > 1e3 ? (n / 1e3).toFixed(0) + " kB" : n + " B";
    pane.innerHTML = `<div class="card"><header><h3>Design files</h3><span class="eyebrow">${esc(D.id)}</span></header>
      ${D.files.length ? `<ul class="filelist">${D.files.map((f) => `<li><a href="/api/designs/${encodeURIComponent(D.id)}/files/${String(f.path).split("/").map(encodeURIComponent).join("/")}" download>${esc(f.path)}</a><span class="muted small num">${fmt(Number(f.size) || 0)}</span></li>`).join("")}</ul>` : `<p class="muted">Nothing to download yet.</p>`}
      ${D.layout_stale ? `<p class="small muted">The board files in layout/ belong to an earlier circuit.</p>` : ""}
      <div class="btnrow">${done ? `<button class="btn primary" type="button" id="do-fab">${D.files.some((f) => f.path.startsWith("fab/")) ? "Export fabrication files again" : "Export Gerbers, drill, BOM and CPL"}</button><button class="btn" type="button" id="do-kicad">Open in KiCad with replay</button>` : `<span class="muted small">Gerbers and the KiCad replay are available once the board passes DRC.</span>`}</div>
      <p class="small" id="files-msg"></p></div>`;
    const say = (text) => { S.filesMsg = { id: D.id, text }; const m = $("files-msg"); if (m) m.textContent = text; };
    if (S.filesMsg && S.filesMsg.id === D.id) $("files-msg").textContent = S.filesMsg.text;
    if (done) {
      $("do-fab").addEventListener("click", async (e) => { e.target.disabled = true; say("Exporting…"); try { const r = await api.post(`/api/designs/${encodeURIComponent(D.id)}/fab`, {}); say(`Wrote ${r.files.length} files.${r.warnings.length ? " Note: " + r.warnings.join(" ") : ""}`); await refreshBundle(); } catch (err) { say(err.message); e.target.disabled = false; } });
      $("do-kicad").addEventListener("click", async () => { say("Opening KiCad…"); try { const r = await api.post(`/api/designs/${encodeURIComponent(D.id)}/kicad`, {}); say(r.launched === false ? `KiCad was not started: ${r.message || "unknown reason"}` : "KiCad's PCB editor is opening and will replay the layout."); } catch (err) { say(err.message); } });
    }
  }

  // ---------- view switching / misc ----------
  function setView(v) {
    $("app").dataset.view = v;
    $("ms-chat").setAttribute("aria-pressed", String(v === "chat"));
    $("ms-results").setAttribute("aria-pressed", String(v === "results"));
    if (v === "results") requestAnimationFrame(updateScale);
  }
  $("ms-chat").addEventListener("click", () => setView("chat"));
  $("ms-results").addEventListener("click", () => setView("results"));
  const closeSide = () => $("side").classList.remove("open");
  const toggleSide = () => { $("side").classList.toggle("open"); if ($("side").classList.contains("open")) $("side-close").focus(); };
  $("menu-btn").addEventListener("click", toggleSide);
  $("ms-menu").addEventListener("click", toggleSide);
  $("side-close").addEventListener("click", closeSide);
  $("backdrop").addEventListener("click", closeSide);
  $("dlist").addEventListener("click", (e) => { if (e.target.closest("a")) closeSide(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape" && $("side").classList.contains("open")) { closeSide(); $("prompt").focus(); } });
  $("new-design").addEventListener("click", () => { closeSide(); if (location.hash) location.hash = ""; else openDesign(null); $("prompt").focus(); });
  $("status-btn").addEventListener("click", () => { $("setup-dlg").showModal(); });
  $("setup-close").addEventListener("click", () => $("setup-dlg").close());
  $("setup-refresh").addEventListener("click", () => loadHealth(true));
  window.addEventListener("hashchange", route);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) loadDesigns(); });

  loadHealth(false);
  loadDesigns().then(route);
  // Poll every 3 s while any design runs (so the composer frees up promptly), every 15 s otherwise.
  function schedulePoll() { clearTimeout(S.pollTimer); S.pollTimer = setTimeout(() => { loadDesigns().finally(schedulePoll); }, S.running ? 3000 : 15000); }
  schedulePoll();
})();
</script>
</body>
</html>
